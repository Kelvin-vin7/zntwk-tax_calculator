apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine-test
spec:
  description: Run the Jasmine unit tests for the Tax Calculator
  workspaces:
    - name: source
  steps:
    - name: npm-test
      image: node:18
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        npm install
        npm test
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Remove all files from the workspace before cloning
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        find . -mindepth 1 -delete
        echo "Workspace cleaned"
